<div>
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta http-equiv="content-type" content="text/html;charset=UTF-8" />
        <title>Lead Form</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"

        <style>
            .lms_form-container,
            .lms_form-container * {
                font-family:
                    "Inter",
                    -apple-system,

            .lms_form-group {

            .lms_form_row {

            .lms_form_row .lms_form-group {
                flex: 1;

            .lms_label {
                display: block;

            .lms_text-center {

                width: 100%;

                margin-top: 0;

                border-radius: 8px;

                background-color: #fff;

            .lms_input::placeholder {
                color: #9ca3af;

            }

            }
            select.lms_input {
                cursor: pointer;
            }
            textarea.lms_input {
                height: auto;
                min-height: 60px;
                resize: vertical;
                padding: 10px 12px;
            }
            .lms_otp_input {
                width: 70%;
                padding: 10px 12px;
                border: 1px solid #e3e7ee;
                border-radius: 8px;
                font-size: 13.5px;
                background-color: #fff;
                height: 38px;
            }
            .lms_button[type="submit"] {
                width: 100%;
                background-color: #3555e3;
                color: #fff;
                padding: 0 16px;
                height: 44px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-size: 15px;
                font-weight: 600;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;

                    background-color 0.2s ease,
                    opacity 0.2s ease;
            }

                background-color: #2a46c4;
            }
            .lms_button[type="submit"]:disabled {
                background-color: #3555e3;

            }
            .lms_button[type="button"] {
                width: 30%;
                background-color: #3555e3;
                color: #fff;
                padding: 12px;
                border: none;
                border-radius: 8px;

            }

                margin: 14px 0 0;

            }

            }
            .lms_phone_input_wrapper {
                display: flex;

            .lms_phone_input_wrapper .lms_input#lms_mobile {
                flex: 1;

            }
            .lms_country_dropdown {

            .lms_country_dropdown .lms_selected_country {
                cursor: pointer;

            .lms_country_dropdown .lms_country_drop_list {

                border-radius: 8px;

                opacity: 0;

                pointer-events: none;

                will-change: max-height, opacity;

            .lms_country_dropdown .lms_country_drop_list.show {
                max-height: 600px;
                opacity: 1;
                pointer-events: auto;
            }
            .lms_country_dropdown input#lms_country_search {
                width: 100%;
                padding: 10px 12px;
                border: none;
                border-bottom: 1px solid #e3e7ee;
                font-size: 13.5px;
                outline: none;
            }
            .lms_country_dropdown ul#lms_country_options {
                list-style: none;
                padding: 0;

            .lms_country_dropdown ul#lms_country_options li:hover {

            .lms_file_upload_wrapper {

                cursor: pointer;

            .lms_file_upload_wrapper:hover {
                border-color: #3555e3;
                background-color: #f0f3ff;
            }
            .lms_file_upload_wrapper.drag-over {
                border-color: #3555e3;
                background-color: #e8edff;
            }
            .lms_file_input_hidden {

            }
            .lms_upload_icon {
                font-size: 48px;
                color: #3555e3;
                margin-bottom: 10px;
            }
            .lms_upload_text {
                font-size: 14px;
                color: #666;
                margin-bottom: 5px;
            }
            .lms_upload_hint {
                font-size: 12px;
                color: #999;
            }
            .lms_error_message {
                display: none;
                margin-top: 10px;
                padding: 10px;
                background-color: #fee;
                border: 1px solid #fcc;
                border-radius: 6px;
                color: #c33;
                font-size: 13px;
                text-align: left;
            }
            .lms_error_message.show {
                display: block;
            }
            .lms_file_preview {
                display: none;
                margin-top: 15px;
                padding: 15px;
                background: #fff;
                border: 1px solid #e0e0e0;

            }
            .lms_file_preview.show {
                display: block;
            }
            .lms_file_item {
                display: flex;
                align-items: center;
                gap: 12px;
                padding: 10px;

            .lms_file_item:last-child {
                margin-bottom: 0;
            }
            .lms_file_icon {
                font-size: 32px;
                color: #3555e3;
                flex-shrink: 0;
            }
            .lms_file_info {
                flex: 1;
                min-width: 0;
            }
            .lms_file_name {
                font-weight: 600;
                font-size: 14px;
                color: #333;
                white-space: nowrap;
                overflow: hidden;

            }
            .lms_file_size {

            }
            .lms_file_actions {
                display: flex;
                gap: 8px;
                flex-shrink: 0;
            }
            .lms_file_action_btn {
                padding: 6px 12px;

                border-radius: 4px;
                cursor: pointer;

            }
            .lms_file_action_btn:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }
            .lms_file_view_btn {
                background-color: #4caf50;
                color: #fff;
            }
            .lms_file_view_btn:hover {
                background-color: #45a049;
            }
            .lms_file_remove_btn {
                background-color: #f44336;

            }
            .lms_file_remove_btn:hover {
                background-color: #da190b;
            }
            .lms_upload_progress {
                margin-top: 10px;
                padding: 10px;
                background-color: #e3f2fd;
                border: 1px solid #90caf9;
                border-radius: 4px;
                color: #1976d2;
                font-size: 13px;
                display: none;
            }
            .lms_upload_progress.show {
                display: block;
            }
            .lms_modal {
                display: none;
                position: fixed;
                z-index: 1000;
                left: 0;
                top: 0;
                width: 100%;
                height: 100%;
                background-color: rgba(0, 0, 0, 0.8);

                justify-content: center;
            }
            .lms_modal.show {
                display: flex;
            }
            .lms_modal_content {
                background-color: #fff;

            .lms_modal_close {
                position: absolute;

                color: #666;

            .lms_modal_body {

            .lms_modal_body img {

            @media (max-width: 420px) {
                .lms_form-container {
                    padding: 20px 16px;
                }
                .lms_form_row {
                    flex-direction: column;
                    gap: 0;
                }
            }
        </style>
    </head>
    <body>
        <div class="lms_form-container">
            <form id="lms_lead_form">
                <input
                    type="text"
                    name="lms_hp"
                    tabindex="-1"
                    autocomplete="off"
                    aria-hidden="true"
                    style="position:absolute;left:-9999px"
                />
                <h3 class="lms_form_title">Request a Training Proposal</h3>
                <p class="lms_form_sub">Tell us your requirements and we'll get back within 24 hours</p>
                <div class="lms_form_row">
                    <div class="lms_form-group">
                        <label class="lms_label" for="lms_name">Company Name</label
                        ><input
                            type="text"
                            class="lms_input"
                            id="lms_name"
                            name="lms_name"
                            placeholder="Your company"
                            required
                        />
                    </div>
                    <div class="lms_form-group">
                        <label class="lms_label" for="lms_contact_person">Contact Person</label
                        ><input
                            type="text"
                            class="lms_input"
                            id="lms_contact_person"
                            name="lms_contact_person"
                            placeholder="Your name"
                            required
                        />
                    </div>
                </div>
                <div class="lms_form-group">
                    <label class="lms_label" for="lms_email">Email Address</label
                    ><input
                        type="email"
                        class="lms_input"
                        id="lms_email"
                        name="lms_email"
                        placeholder="work@company.com"
                        required
                    />
                </div>
                <div class="lms_form-group">
                    <label class="lms_label" for="lms_mobile">Phone Number</label>
                    <div class="lms_phone_input_wrapper">
                        <div class="lms_country_dropdown">
                            <div class="lms_selected_country" id="lms_selected_country">+91 (IN)</div>
                            <div class="lms_country_drop_list" id="lms_country_drop_list">
                                <input type="text" autocomplete="off" style="display: none" /><input
                                    type="text"
                                    id="lms_country_search"
                                    placeholder="Search country..."
                                    autocomplete="off"
                                    autocorrect="off"
                                    spellcheck="false"
                                    name="lms_country_search"
                                    autocomplete="new-password"
                                />
                                <ul id="lms_country_options"></ul>
                            </div>
                        </div>
                        <input
                            type="text"
                            class="lms_input"
                            id="lms_mobile"
                            name="lms_mobile"
                            pattern="^\d{10}$"
                            maxlength="10"
                            required
                            placeholder="+91 XXXXX XXXXX"
                            oninput='this.value=this.value.replace(/\D/g,""),this.setCustomValidity("")'
                            oninvalid='this.setCustomValidity("Please enter a valid 10-digit mobile number")'
                        /><input type="hidden" name="lms_country_code" id="lms_country_code" />
                    </div>
                </div>
                <div class="lms_form-group">
                    <label class="lms_label" for="lms_product_drop">Training Requirement</label>
                    <select id="lms_product_drop" class="lms_input" name="lms_product_drop" required>
                        <option value="">Select training topic</option>
                        <!-- Options will be dynamically populated -->
                    </select>
                </div>
                <div class="lms_form-group">
                    <label class="lms_label" for="lms_comments">Message</label>
                    <textarea
                        id="lms_comments"
                        class="lms_input"
                        name="lms_comments"
                        rows="3"
                        placeholder="Number of employees, preferred dates, location..."
                    ></textarea>
                </div>
                <button class="lms_button" type="submit">
                    Send Proposal Request <span aria-hidden="true">&rarr;</span>
                </button>
                <p class="lms_form_footer">
                    Or email us at <a href="mailto:aptechlearningwhitefield@gmail.com">aptechlearningwhitefield@gmail.com</a>
                </p>
            </form>
        </div>
    </body>
</div>

<script>
    // Tag every LMS lead with the website enquiry type and mirror it to the
    // website Inbox/Sheets without intercepting the vendor's native submit.
    (() => {
        const form = document.getElementById("lms_lead_form");
        if (!form) return;
        const allowedTypes = new Set(["student-enquiry", "corporate-enquiry", "schools-colleges", "general-enquiry"]);
        const requestedType = new URLSearchParams(window.location.search).get("enquiryType");
        const enquiryType = requestedType && allowedTypes.has(requestedType) ? requestedType : "corporate-enquiry";
        const enquiryContext = new URLSearchParams(window.location.search).get("context")?.slice(0, 300) || "";
        const enquiryLabels = {
            "student-enquiry": "Student Enquiry",
            "corporate-enquiry": "Corporate Enquiry",
            "schools-colleges": "Schools & Colleges Enquiry",
            "general-enquiry": "General Enquiry",
        };
        const title = form.querySelector(".lms_form_title");
        if (title) title.textContent = enquiryLabels[enquiryType];
        const submitButton = form.querySelector("button[type='submit']");
        if (submitButton) submitButton.firstChild.textContent = "Send Enquiry ";
        if (enquiryType === "student-enquiry") {
            form.innerHTML = `
                <h3 class="lms_form_title">Student Enquiry Form</h3>
                <p class="lms_form_sub">Fill in your details and we'll call you back within 24 hours</p>
                <div class="lms_form_row">
                    <div class="lms_form-group"><label class="lms_label" for="lms_name">Full Name *</label><input class="lms_input" id="lms_name" name="lms_name" type="text" placeholder="Your full name" required /></div>
                    <div class="lms_form-group"><label class="lms_label" for="lms_mobile">Mobile Number *</label>
                        <div class="lms_phone_input_wrapper">
                            <div class="lms_country_dropdown"><div class="lms_selected_country" id="lms_selected_country">+91 (IN)</div><div class="lms_country_drop_list" id="lms_country_drop_list"><input type="text" autocomplete="off" style="display:none" /><input type="text" id="lms_country_search" name="lms_country_search" placeholder="Search country..." autocomplete="off" /><ul id="lms_country_options"></ul></div></div>
                            <input class="lms_input" id="lms_mobile" name="lms_mobile" type="text" pattern="^\\d{10}$" maxlength="10" placeholder="+91 XXXXX XXXXX" required oninput='this.value=this.value.replace(/\\D/g,""),this.setCustomValidity("")' oninvalid='this.setCustomValidity("Please enter a valid 10-digit mobile number")' />
                            <input type="hidden" name="lms_country_code" id="lms_country_code" value="+91" />
                        </div>
                    </div>
                </div>
                <div class="lms_form-group"><label class="lms_label" for="lms_email">Email Address *</label><input class="lms_input" id="lms_email" name="lms_email" type="email" placeholder="your@email.com" required /></div>
                <div class="lms_form_row">
                    <div class="lms_form-group"><label class="lms_label" for="lms_city">City</label><input class="lms_input" id="lms_city" name="lms_city" type="text" placeholder="Your city" /></div>
                    <div class="lms_form-group"><label class="lms_label" for="lms_qualification">Qualification</label><input class="lms_input" id="lms_qualification" name="lms_qualification" type="text" placeholder="e.g. B.Tech, BCA, 12th" /></div>
                </div>
                <div class="lms_form-group"><label class="lms_label" for="lms_current_status">Current Status</label><select class="lms_input" id="lms_current_status" name="lms_current_status"><option value="">Select your status</option><option>Student</option><option>Fresher / Recent Graduate</option><option>Working Professional</option><option>Job Seeker</option><option>Career Break</option></select></div>
                <div class="lms_form-group"><label class="lms_label" for="lms_product_drop">Interested Course *</label><select class="lms_input" id="lms_product_drop" name="lms_product_drop" required><option value="">Select a course</option></select></div>
                <div class="lms_form-group"><label class="lms_label" for="lms_learning_mode">Learning Mode</label><select class="lms_input" id="lms_learning_mode" name="lms_learning_mode"><option value="">Select learning mode</option><option>Classroom (Whitefield Centre)</option><option>Online (Live Classes)</option><option>Both (Hybrid)</option></select></div>
                <div class="lms_form-group"><label class="lms_label" for="lms_comments">Message</label><textarea class="lms_input" id="lms_comments" name="lms_comments" rows="4" placeholder="Any specific questions or requirements?"></textarea></div>
                <button class="lms_button" type="submit">Submit Enquiry <span aria-hidden="true">&rarr;</span></button>
            `;
            const countryCode = document.getElementById("lms_country_code");
            if (countryCode) countryCode.value = "+91";
            const courseSelect = document.getElementById("lms_product_drop");
            if (courseSelect) {
                const syncCourseOptions = () => {
                    Array.from(courseSelect.options).forEach((option) => {
                        if (/cyber\s*security/i.test(option.textContent || "")) option.remove();
                    });
                    ["Data Analytics Using Power BI", "Data Visualization Using Power BI"].forEach((label) => {
                        const exists = Array.from(courseSelect.options).some((option) => option.textContent.trim().toLowerCase() === label.toLowerCase());
                        if (!exists) courseSelect.add(new Option(label, label));
                    });
                };
                new MutationObserver(syncCourseOptions).observe(courseSelect, { childList: true });
                syncCourseOptions();
            }
        }
        const organizationLabel = form.querySelector('label[for="lms_name"]');
        if (organizationLabel && enquiryType === "schools-colleges") organizationLabel.textContent = "Institution Name";
        if (organizationLabel && enquiryType === "general-enquiry") organizationLabel.textContent = "Your Name";
        const contactLabel = form.querySelector('label[for="lms_contact_person"]');
        const contactInput = form.querySelector("#lms_contact_person");
        if (enquiryType === "general-enquiry") {
            if (contactLabel) contactLabel.textContent = "Contact Person (optional)";
            if (contactInput) contactInput.required = false;
        }
        const commentsField = form.querySelector("#lms_comments");
        if (commentsField && enquiryType === "general-enquiry") commentsField.placeholder = "Subject and message";
        const button = form.querySelector('button[type="submit"]');
        const notice = document.createElement("p");
        notice.setAttribute("role", "status");
        notice.setAttribute("aria-live", "polite");
        notice.style.cssText = "margin:10px 0;color:#b42318;font-size:13px;text-align:center";
        button.insertAdjacentElement("afterend", notice);

        const reportFormHeight = () => {
            const height = Math.ceil(document.documentElement.scrollHeight);
            window.parent.postMessage({ type: "aptech-lms-form-resize", height }, window.location.origin);
        };
        if ("ResizeObserver" in window) {
            new ResizeObserver(reportFormHeight).observe(document.querySelector(".lms_form-container"));
        }
        window.addEventListener("load", reportFormHeight);
        requestAnimationFrame(reportFormHeight);

        form.addEventListener("submit", () => {
            // Show the site confirmation as the LMS takes over/redirects. The
            // spreadsheet archive is best-effort and must not change this UX.
            window.parent.postMessage({ type: "aptech-enquiry-submitting" }, window.location.origin);
            const value = (id) => form.querySelector(`#${id}`)?.value?.trim() || "";
            const countryCode = value("lms_country_code");
            const phone = `${countryCode} ${value("lms_mobile")}`.trim();
            const contactPerson = value(enquiryType === "student-enquiry" || enquiryType === "general-enquiry" ? "lms_name" : "lms_contact_person");
            const fields = enquiryType === "student-enquiry" ? {
                "Mobile": phone,
                "City": value("lms_city"),
                "Qualification": value("lms_qualification"),
                "Current Status": value("lms_current_status"),
                "Interested Course": value("lms_product_drop"),
                "Learning Mode": value("lms_learning_mode"),
                "Website Enquiry Type": enquiryLabels[enquiryType],
            } : enquiryType === "schools-colleges" ? {
                "Institution Name": value("lms_name"),
                "Contact Person": value("lms_contact_person"),
                Phone: phone,
                "Program Type": value("lms_product_drop"),
                "Website Enquiry Type": enquiryLabels[enquiryType],
                ...(enquiryContext && { "Enquiry Context": enquiryContext }),
            } : enquiryType === "general-enquiry" ? {
                Subject: value("lms_product_drop"),
                "Mobile": phone,
                "Website Enquiry Type": enquiryLabels[enquiryType],
                ...(enquiryContext && { "Enquiry Context": enquiryContext }),
            } : {
                "Company Name": value("lms_name"),
                "Contact Person": value("lms_contact_person"),
                Phone: phone,
                "Training Requirement": value("lms_product_drop"),
                "Website Enquiry Type": enquiryLabels[enquiryType],
                ...(enquiryContext && { "Enquiry Context": enquiryContext }),
            };
            const comments = form.querySelector("#lms_comments");
            const typeNote = `Website enquiry type: ${enquiryLabels[enquiryType]}${enquiryContext ? ` | ${enquiryContext}` : ""}`;
            if (comments && !comments.value.startsWith(typeNote)) {
                comments.value = `${typeNote}${comments.value.trim() ? `\n${comments.value.trim()}` : ""}`;
            }

            fetch("/api/submit-enquiry", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    keepalive: true,
                    body: JSON.stringify({
                        formName: enquiryType,
                        user: { name: contactPerson, email: value("lms_email") },
                        conversation: {
                            messages_attributes: [{ body: value("lms_comments") || (enquiryType === "student-enquiry" ? "New student enquiry submitted" : "Corporate training proposal request") }],
                            data: fields,
                        },
                    }),
                })
                .then(async (response) => {
                    const result = await response.json().catch(() => null);
                    if (!response.ok || result?.success !== true) {
                        throw new Error(result?.error || `Submission failed (${response.status})`);
                    }
                })
                .catch((error) => {
                    console.error("Corporate enquiry Inbox delivery failed", error);
                    notice.textContent = "Your request is being sent to the LMS. We couldn't confirm the email copy; for urgent help call +91 74113 33500.";
                });
        });
    })();
</script>
